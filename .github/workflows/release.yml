name: Build & release

# Every push to main builds a Windows installer and publishes it as a GitHub
# Release. Installed copies of the app check those releases and update
# themselves, so nobody has to download anything by hand.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run build

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Version = major.minor from package.json + the build number, so every
      # push gets a higher version and the updater picks it up.
      - name: Set version
        id: version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          v="$base.${{ github.run_number }}"
          npm version "$v" --no-git-tag-version
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Build on the runner, then create the release in one call with every
      # file attached, so the updater never sees a half-uploaded release.
      - name: Build installer
        run: npm run dist
      - name: Publish release
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          ls dist
          test -f dist/latest.yml
          gh release create "v$v" \
            "dist/CADCAM-Studio-Setup-$v.exe" \
            "dist/CADCAM-Studio-Setup-$v.exe.blockmap" \
            dist/latest.yml \
            --target "$GITHUB_SHA" --title "v$v" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
