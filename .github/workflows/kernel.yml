name: CAD kernel

# Builds the app's CAD kernel: OpenCascade + kernel/cadkernel.cpp compiled to
# WebAssembly with native wasm exceptions. The result is committed to
# src/renderer/public/vendor/cadkernel/ by hand after checking it, so app
# releases don't depend on this (slow) build.
on:
  push:
    paths: ['kernel/**', '.github/workflows/kernel.yml']
  workflow_dispatch:

env:
  OCCT_TAG: V7_9_3
  EMSDK_VERSION: 4.0.20
  FLAGS: -O3 -fwasm-exceptions

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: OpenCascade source
        run: git clone --depth 1 --branch "$OCCT_TAG" https://github.com/Open-Cascade-SAS/OCCT.git occt
      - name: Cache OpenCascade build
        id: occt-cache
        uses: actions/cache@v4
        with:
          path: occt-build
          key: occt-${{ env.OCCT_TAG }}-emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('.github/workflows/kernel.yml') }}
      - name: Build OpenCascade
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build >/dev/null
          emcmake cmake -G Ninja -S occt -B occt-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DBUILD_LIBRARY_TYPE=Static \
            -DBUILD_MODULE_FoundationClasses=ON -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON -DBUILD_MODULE_Visualization=ON \
            -DBUILD_MODULE_ApplicationFramework=ON -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_DETools=OFF -DBUILD_MODULE_Draw=OFF -DBUILD_DOC_Overview=OFF \
            -DUSE_FREETYPE=OFF -DUSE_FREEIMAGE=OFF -DUSE_OPENGL=OFF -DUSE_GLES2=OFF \
            -DUSE_TK=OFF -DUSE_XLIB=OFF -DUSE_RAPIDJSON=OFF -DUSE_DRACO=OFF -DUSE_TBB=OFF -DUSE_VTK=OFF \
            -DUSE_FFMPEG=OFF -DUSE_OPENVR=OFF
          cmake --build occt-build --target TKDESTEP TKDEIGES -- -j4
      - name: Build kernel
        run: |
          mkdir -p out
          incs=$(for d in occt/src/*/; do printf -- '-I%s ' "$d"; done)
          libs=$(find occt-build -name 'libTK*.a' | sort | tr '\n' ' ')
          echo "$libs" | tr ' ' '\n' | sed 's#.*/##'
          em++ -std=c++17 $FLAGS $incs kernel/cadkernel.cpp $libs -lembind \
            -sMODULARIZE=1 -sEXPORT_ES6=1 -sEXPORT_NAME=createCadKernel \
            -sALLOW_MEMORY_GROWTH=1 -sMAXIMUM_MEMORY=4GB -sSTACK_SIZE=4MB \
            -sENVIRONMENT=web,worker,node -sFORCE_FILESYSTEM=1 -sEXPORTED_RUNTIME_METHODS=FS \
            -o out/cadkernel.js
          cp occt/LICENSE_LGPL_21.txt out/LICENSE-OCCT.txt 2>/dev/null || cp occt/LICENSE* out/ || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: cadkernel
          path: out/
