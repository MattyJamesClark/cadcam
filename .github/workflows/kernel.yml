name: CAD kernel

# Builds the app's CAD kernel: OpenCascade + kernel/cadkernel.cpp compiled to
# WebAssembly with native wasm exceptions. The result is committed to
# src/renderer/public/vendor/cadkernel/ by hand after checking it, so app
# releases don't depend on this (slow) build.
on:
  push:
    paths: ['kernel/*.cpp', 'kernel/*.sh', 'kernel/*.mjs', '.github/workflows/kernel.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  OCCT_TAG: V7_9_3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    # Two toolchains: emsdk 4.0.20 with legacy EH produced an invalid module
    # (LLVM br_table arity bug), so try an older emsdk and the new exnref EH.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: em3-legacy
            emsdk: 3.1.74
            flags: -O3 -fwasm-exceptions
          - variant: em4-exnref
            emsdk: 4.0.20
            flags: -O3 -fwasm-exceptions -sWASM_LEGACY_EXCEPTIONS=0
    env:
      EMSDK_VERSION: ${{ matrix.emsdk }}
      FLAGS: ${{ matrix.flags }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache
      - name: OpenCascade source
        run: git clone --depth 1 --branch "$OCCT_TAG" https://github.com/Open-Cascade-SAS/OCCT.git occt
      - name: Restore OpenCascade build
        id: occt-cache
        uses: actions/cache/restore@v4
        with:
          path: occt-build
          key: occt-${{ env.OCCT_TAG }}-emsdk-${{ env.EMSDK_VERSION }}-${{ matrix.variant }}-v1
      - name: Build OpenCascade
        if: steps.occt-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build >/dev/null
          emcmake cmake -G Ninja -S occt -B occt-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="$FLAGS" -DCMAKE_CXX_FLAGS="$FLAGS" \
            -DBUILD_LIBRARY_TYPE=Static \
            -DBUILD_MODULE_FoundationClasses=ON -DBUILD_MODULE_ModelingData=ON \
            -DBUILD_MODULE_ModelingAlgorithms=ON -DBUILD_MODULE_Visualization=ON \
            -DBUILD_MODULE_ApplicationFramework=ON -DBUILD_MODULE_DataExchange=ON \
            -DBUILD_MODULE_DETools=OFF -DBUILD_MODULE_Draw=OFF -DBUILD_DOC_Overview=OFF \
            -DUSE_FREETYPE=OFF -DUSE_FREEIMAGE=OFF -DUSE_OPENGL=OFF -DUSE_GLES2=OFF \
            -DUSE_TK=OFF -DUSE_XLIB=OFF -DUSE_RAPIDJSON=OFF -DUSE_DRACO=OFF -DUSE_TBB=OFF -DUSE_VTK=OFF \
            -DUSE_FFMPEG=OFF -DUSE_OPENVR=OFF
          cmake --build occt-build --target TKDESTEP TKDEIGES -- -j4
      # Save straight away, so a failure in the kernel step doesn't cost an hour of OCCT rebuild.
      - name: Save OpenCascade build
        if: steps.occt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: occt-build
          key: occt-${{ env.OCCT_TAG }}-emsdk-${{ env.EMSDK_VERSION }}-${{ matrix.variant }}-v1
      - name: Build kernel
        run: kernel/build.sh
        env:
          VARIANT: ${{ matrix.variant }}
      # Commit the built kernel next to its worker on this branch, so it can be
      # tested and then merged into main with the app changes that use it.
      - name: Commit kernel
        run: |
          dest=kernel/builds/${{ matrix.variant }}
          mkdir -p $dest
          cp out/cadkernel.js out/cadkernel.wasm out/BUILD.txt $dest/
          cp out/LICENSE* $dest/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $dest
          git commit -m "Built CAD kernel ($(cat out/BUILD.txt))" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break; sleep 5; done
